name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine and API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11.16"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            fonts-dejavu-core fonts-wqy-zenhei postgresql
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pinned Python dependencies in a local environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/python -m pip install --require-hashes \
            --requirement requirements-build.txt
          .venv/bin/python -m pip install --requirement requirements-dev.txt
          .venv/bin/python -m pip install --require-hashes \
            --requirement requirements-sandbox.txt
          .venv/bin/python -m pip install --no-build-isolation --no-deps \
            --editable ./engine --editable ./api
          .venv/bin/python scripts/verify_dependency_locks.py
          .venv/bin/python -m pip check
      - name: Run engine tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/python-test-reports"
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m pytest -q engine/tests \
            --junitxml="$RUNNER_TEMP/python-test-reports/engine.xml" \
            2>&1 | tee "$RUNNER_TEMP/python-test-reports/engine.log"
      - name: Run Python correctness and import checks
        run: .venv/bin/ruff check api/src engine/src scripts
      - name: Run API tests
        env:
          # GitHub-hosted runners are nested VMs. Probe the complete rootless
          # mount/Python/UDS profile on ptrace; guarded integration tests skip
          # when the hosted kernel rejects that profile. The release rootful
          # profile is verified by the real Docker checkpoint/restore gate.
          SANDBOX_GVISOR_PLATFORM: ptrace
        run: |
          set -o pipefail
          runsc_path="$(bash scripts/get_runsc.sh)"
          PATH="$PWD/.venv/bin:$PATH" RUNSC_PATH="$runsc_path" \
            .venv/bin/python -c 'from vibecanvas_api.services.sandbox import _gvisor_runnable; print(f"rootless_gvisor_full_profile={_gvisor_runnable()}")'
          PATH="$PWD/.venv/bin:$PATH" RUNSC_PATH="$runsc_path" \
            .venv/bin/python -m pytest -q api/tests \
            --junitxml="$RUNNER_TEMP/python-test-reports/api.xml" \
            2>&1 | tee "$RUNNER_TEMP/python-test-reports/api.log"
      - name: Upload Python test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-reports-${{ github.sha }}
          path: ${{ runner.temp }}/python-test-reports
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.21.0"
      - name: Activate the pinned pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
      - name: Install the frozen Web dependency graph
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run Web quality gates
        working-directory: web
        run: |
          pnpm lint
          pnpm lint:visual
          pnpm lint:routes
          pnpm lint:locales
          pnpm lint:retired-ui
          pnpm test
          pnpm build
          pnpm lint:bundle

  extension:
    name: Browser extension tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.21.0"
      - name: Activate the pinned pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
      - name: Install, test, and build the frozen extension graph
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

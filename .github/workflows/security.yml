name: Security gates

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-evidence-contract:
    name: Production evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate the checked-in evidence template
        run: >-
          python3 scripts/security/verify_production_evidence.py
          docs/production-evidence-manifest.example.json
          --allow-pending

  dependency-audit:
    name: Production dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11.16"
      - name: Verify dependency lock consistency
        run: python scripts/verify_dependency_locks.py
      - name: Audit resolved Python production dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install --upgrade pip==26.2.1
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install \
            --require-hashes --requirement requirements-build.txt
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install \
            --require-hashes --requirement requirements-runtime.txt
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install \
            --no-build-isolation --no-deps --editable ./engine --editable ./api
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install \
            pip-audit==2.10.1
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit \
            --progress-spinner off
      - name: Set up Node.js 22
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22.23.2"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
      - name: Audit Web production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=low
      - name: Audit extension production dependencies
        working-directory: extension
        run: pnpm audit --prod --audit-level=low

  container-supply-chain:
    name: Production image SBOM and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Syft and Grype
        run: scripts/security/install_sbom_tools.sh "$RUNNER_TEMP/flowork-tools"
      - name: Build, inventory, and scan every production image
        env:
          SYFT_BIN: ${{ runner.temp }}/flowork-tools/syft
          GRYPE_BIN: ${{ runner.temp }}/flowork-tools/grype
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: scripts/security/scan_container_images.sh "$RUNNER_TEMP/container-security"
      - name: Upload immutable-checksummed SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.sha }}
          path: ${{ runner.temp }}/container-security
          if-no-files-found: error
          retention-days: 14

  upload-malware-live:
    name: Real ClamAV upload boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11.16"
      - name: Install the production upload boundary
        run: |
          python -m venv "$RUNNER_TEMP/clamav-live"
          "$RUNNER_TEMP/clamav-live/bin/python" -m pip install \
            --require-hashes --requirement requirements-build.txt
          "$RUNNER_TEMP/clamav-live/bin/python" -m pip install \
            --require-hashes --requirement requirements-runtime.txt
          "$RUNNER_TEMP/clamav-live/bin/python" -m pip install \
            --no-build-isolation --no-deps --editable ./engine --editable ./api
      - name: Verify clean concurrency, EICAR blocking, and unavailable fail-closed
        env:
          VIBECANVAS_PYTHON: ${{ runner.temp }}/clamav-live/bin/python
        run: scripts/security/verify_clamav_live.sh

  browser-extension-security:
    name: MV3 permissions, credential transport, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22.23.2"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
      - name: Install locked extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile
      - name: Run extension protocol and security boundary tests
        working-directory: extension
        run: pnpm test
      - name: Build the MV3 release payload
        working-directory: extension
        run: pnpm build

  authorization-model:
    name: OpenFGA model and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned OpenFGA CLI
        run: scripts/security/install_openfga_cli.sh "$RUNNER_TEMP/fga"
      - name: Validate modular model
        run: >-
          "$RUNNER_TEMP/fga" model validate
          --file api/src/vibecanvas_api/authorization/model/fga.mod
      - name: Run authorization model scenarios
        run: >-
          "$RUNNER_TEMP/fga" model test
          --tests
          api/src/vibecanvas_api/authorization/model/model.fga.yaml

  authorization-live:
    name: OpenFGA PostgreSQL live contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate deployment topology
        # A clean checkout intentionally has no secret-bearing `.env`. Validate
        # the public example contract without creating or copying a fake secret
        # file into the workspace.
        run: >-
          VIBECANVAS_ENV_FILE=.env.example
          docker compose --env-file .env.example config --quiet
      - name: Install narrow Python client dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/openfga-test"
          "$RUNNER_TEMP/openfga-test/bin/python" -m pip install "httpx==0.28.1"
      - name: Verify pinned OpenFGA against independent PostgreSQL
        env:
          VIBECANVAS_PYTHON: ${{ runner.temp }}/openfga-test/bin/python
        run: scripts/security/verify_openfga_live.sh

  secrets:
    name: Secret history and worktree scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: scripts/security/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: scripts/security/scan_secrets.sh

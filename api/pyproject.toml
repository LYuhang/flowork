[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vibecanvas-api"
version = "0.3.0"
description = "Flowork API, agent runtime, persistence, authorization, and sandbox control plane."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Flowork contributors" },
]
keywords = ["workflow", "agent", "runtime", "flowork"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Workflow execution engine.
    "vibecanvas-engine>=0.3.0,<0.4",
    # Transitional implementation detail of workflow SubAgentNode only. These
    # packages are lazy-loaded inside the workflow sandbox; LangChain is not an
    # installed/selectable Flowork Agent Runtime.
    "langchain>=1.3.9,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-google-genai>=4,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    # LLM providers
    "openai>=1.0",
    # Engine deps imported directly by api code (re-declared for explicit version control)
    "jsonschema>=4.0",
    "requests>=2.25",
    # Engine deps used only transitively; declared for explicit version control of the resolved set
    "jinja2>=3.0",
    "json_repair>=0.60.1",
    # Authentication: password hashing and email validation.
    "passlib[argon2]>=1.7.4,<2",
    "email-validator>=2.0,<3",
    # Config / data
    "pyyaml>=6.0",
    "pydantic>=2.0,<3",
    "pandas>=1.5",
    # Image handling
    "Pillow>=12.3.0",
    "reportlab>=4.4,<5",
    # FastAPI service layer.
    "fastapi>=0.141,<0.142",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.30,<1.0",
    # Celery and Redis for durable background tasks.
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    # Authorization control plane. The application owns the stable
    # AuthzService contract and speaks OpenFGA's HTTP API through a narrow
    # adapter; product routes never import an OpenFGA SDK.
    "httpx>=0.27,<1",
    # Sandbox Service transport. The same protobuf/gRPC contract runs over a
    # Unix socket locally and mTLS TCP for a remote sandbox cluster.
    "grpcio>=1.82.1,<1.83",
    "grpcio-health-checking>=1.82.1,<1.83",
    "protobuf>=7.34,<8",
    # Cron expression parsing for scheduled Tasks.
    "croniter>=2,<3",
    # MCP (Model Context Protocol) — client/session/runtime dependencies used by
    # the chat-sandbox MCP supervisor. Local/test MCP servers can use
    # ``mcp.server.fastmcp`` from the upstream SDK; do not depend on the
    # separate ``fastmcp`` package because its pydocket/OpenTelemetry line
    # conflicts with the current API service stack.
    # Third-party stdio MCP packages may still be installed through npx/uvx/pip
    # according to their own registration config.
    "mcp>=1.24,<2",
    # Web search — DuckDuckGo HTML uses requests + BeautifulSoup below;
    # Tavily/Brave need WEB_SEARCH_API_KEY.
    # Agent-native Knowledge — file parsers and deterministic text chunking.
    "pypdf>=6.14.2,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "markdown>=3.5,<4",
    "beautifulsoup4>=4.12,<5",
    "tiktoken>=0.8,<1",
    # Structured logs, traces, and metrics.
    # IMPORTANT: use the OTLP -proto-http exporter, NOT -proto-grpc. Keeping
    # the HTTP exporter avoids an unnecessary grpcio runtime while the current
    # OTel line provides a patched protobuf dependency.
    "structlog>=24.1,<26",
    "prometheus-client>=0.20,<1",
    "prometheus-fastapi-instrumentator>=8.1,<9",
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-sdk>=1.44,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66b0",
    "opentelemetry-instrumentation-celery>=0.65b0,<0.66b0",
    "opentelemetry-instrumentation-redis>=0.65b0,<0.66b0",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66b0",
    "setuptools>=83,<84",
    "cryptography>=50,<51",
    # Phishing-resistant step-up for high-risk administration. Verification
    # remains server-side; browsers only receive standard WebAuthn options.
    "webauthn>=2.7.1,<3",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.20",
    "grpcio-tools>=1.82.1,<1.83",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6,<9",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[project.scripts]
vibecanvas-api = "vibecanvas_api.cli:main"
vibecanvas-encrypt-legacy-secrets = "vibecanvas_api.security.migrate_legacy_secrets:main"
flowork-document-mcp = "vibecanvas_api.document_runtime.server:main"

[project.urls]
Repository = "https://github.com/LYuhang/flowork"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecanvas_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "gvisor: end-to-end tests that boot a real rootless-gVisor sandbox (skip cleanly when runsc is unavailable)",
]

syntax = "proto3";

package vibecanvas.sandbox.v1;

// Stable transport contract. Rich operation payloads remain versioned JSON so
// Runtime/Workflow events can evolve independently without regenerating the
// service for every product event field.
service SandboxService {
  rpc Stats(StatsRequest) returns (StatsResponse);
  rpc Acquire(AcquireRequest) returns (AcquireResponse);
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc Execute(ExecuteRequest) returns (stream SandboxEvent);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc Release(ReleaseRequest) returns (InspectResponse);
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  rpc Admin(AdminRequest) returns (AdminResponse);
}

message StatsRequest {}

message StatsResponse {
  string status = 1;
  int64 pid = 2;
  int64 generation = 3;
  double uptime_seconds = 4;
  int32 resident = 5;
  int32 capacity = 6;
  int32 busy = 7;
  int32 resident_leases = 8;
  int32 pending_closes = 9;
}

message SandboxScope {
  string tenant_id = 1;
  string kind = 2;
  string scope_id = 3;
}

message SandboxRef {
  string sandbox_id = 1;
  string provider = 2;
  string endpoint = 3;
  int64 generation = 4;
}

message SessionDescriptor {
  SandboxScope scope = 1;
  string run_dir = 2;
  string workflow_run_dir = 3;
  string workflow_run_id = 4;
  string lease = 5;
  bool expose_run = 6;
}

message WorkflowRunSource {
  string tenant_id = 1;
  string workflow_id = 2;
}

message AcquireRequest {
  SandboxScope scope = 1;
  string principal_id = 2;
  string runtime_profile = 3;
  string resource_profile = 4;
  string lifecycle_policy = 5;
  string network_policy_id = 6;
  string environment_layer_digest = 7;
  string snapshot_policy = 8;
  bool expose_run = 9;
  bool expose_runtime = 10;
  string request_id = 11;
  // Omitted by older clients means enabled; explicit false never hydrates/binds /mount.
  optional bool expose_mount = 12;
  WorkflowRunSource workflow_run_source = 13;
}

message AcquireResponse {
  SandboxRef ref = 1;
  SessionDescriptor session = 2;
}

message ConnectRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
}

message ConnectResponse {
  bool found = 1;
  SandboxRef ref = 2;
  SessionDescriptor session = 3;
}

message InspectRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
}

message InspectResponse {
  string status = 1;
  SandboxRef ref = 2;
  bytes details_json = 3;
}

message ExecuteRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
  string operation_id = 3;
  string kind = 4;
  bytes payload_json = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  int64 generation = 2;
  string operation_id = 3;
  int64 event_seq = 4;
  string type = 5;
  bytes payload_json = 6;
}

message InvokeRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
  string operation_id = 3;
  string kind = 4;
  bytes payload_json = 5;
}

message InvokeResponse { bytes payload_json = 1; }

message ControlRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
  string operation_id = 3;
  string action = 4;
  bytes payload_json = 5;
}

message ControlResponse {
  bool accepted = 1;
  bytes payload_json = 2;
}

message ReleaseRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
  string reason = 3;
}

message CheckpointRequest {
  SandboxScope scope = 1;
  int64 expected_generation = 2;
  string policy = 3;
}

message CheckpointResponse { string snapshot_id = 1; }

// Trusted control-plane maintenance calls; never expose this RPC directly to
// browsers or user-provided code.
message AdminRequest {
  string kind = 1;
  bytes payload_json = 2;
}

message AdminResponse { bytes payload_json = 1; }

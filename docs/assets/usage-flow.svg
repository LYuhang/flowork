<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title description">
  <title id="title">Flowork product workflow</title>
  <desc id="description">A four-stage flow from describing a goal, through Agent execution and Workflow refinement, to running Tasks or publishing Deployments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1118" height="518" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="48" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">From idea to production</text>
  <text x="44" y="76" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Build once, inspect every step, then run or publish with confidence.</text>

  <path d="M268 220 H302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M534 220 H568" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M800 220 H834" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="44" y="110" width="224" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="64" y="130" width="54" height="25" rx="12.5" fill="#eef2ff"/>
    <text x="91" y="147" text-anchor="middle" fill="#4338ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">01</text>
    <text x="64" y="188" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Start</text>
    <text x="64" y="214" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Describe the outcome.</text>
    <rect x="64" y="238" width="184" height="31" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="79" cy="253.5" r="4" fill="#4f46e5"/>
    <text x="91" y="258" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Chat</text>
    <rect x="64" y="279" width="184" height="31" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="79" cy="294.5" r="4" fill="#4f46e5"/>
    <text x="91" y="299" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Browser extension</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="110" width="224" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="330" y="130" width="54" height="25" rx="12.5" fill="#f3e8ff"/>
    <text x="357" y="147" text-anchor="middle" fill="#7e22ce" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">02</text>
    <text x="330" y="188" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Build with Agent</text>
    <text x="330" y="214" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Turn intent into a plan.</text>
    <rect x="330" y="238" width="184" height="31" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <circle cx="345" cy="253.5" r="4" fill="#9333ea"/>
    <text x="357" y="258" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Agent runtimes</text>
    <rect x="330" y="275" width="184" height="39" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <circle cx="345" cy="294.5" r="4" fill="#9333ea"/>
    <text x="357" y="291" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">
      <tspan x="357" dy="0">Tools, Skills, and MCP</tspan>
      <tspan x="357" dy="14">Knowledge sources</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="576" y="110" width="224" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="596" y="130" width="54" height="25" rx="12.5" fill="#ecfeff"/>
    <text x="623" y="147" text-anchor="middle" fill="#0e7490" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">03</text>
    <text x="596" y="188" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Refine Workflow</text>
    <text x="596" y="214" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Inspect before publishing.</text>
    <rect x="596" y="238" width="184" height="31" rx="8" fill="#ecfeff" stroke="#cffafe"/>
    <circle cx="611" cy="253.5" r="4" fill="#0891b2"/>
    <text x="623" y="258" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Canvas and versions</text>
    <rect x="596" y="279" width="184" height="31" rx="8" fill="#ecfeff" stroke="#cffafe"/>
    <circle cx="611" cy="294.5" r="4" fill="#0891b2"/>
    <text x="623" y="299" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Runs, output, failures</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="110" width="234" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="862" y="130" width="54" height="25" rx="12.5" fill="#ecfdf5"/>
    <text x="889" y="147" text-anchor="middle" fill="#047857" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">04</text>
    <text x="862" y="188" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Run or publish</text>
    <text x="862" y="214" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Choose the delivery path.</text>
    <rect x="862" y="232" width="194" height="25" rx="7" fill="#ecfdf5" stroke="#d1fae5"/>
    <text x="875" y="249" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Run now</text>
    <rect x="862" y="265" width="194" height="25" rx="7" fill="#ecfdf5" stroke="#d1fae5"/>
    <text x="875" y="282" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">Batch or scheduled Task</text>
    <rect x="862" y="298" width="194" height="25" rx="7" fill="#ecfdf5" stroke="#d1fae5"/>
    <text x="875" y="315" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600">API or webhook</text>
  </g>

  <path d="M959 330 V380" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M310 432 H156 V338" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <g>
    <rect x="310" y="388" width="766" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="330" y="408" width="118" height="24" rx="12" fill="#f1f5f9"/>
    <text x="389" y="424.5" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7">FEEDBACK LOOP</text>
    <text x="330" y="454" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Review outputs and failures, then refine the Workflow in Chat.</text>
  </g>
</svg>

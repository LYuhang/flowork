[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vibecanvas-engine"
version = "0.3.0"
description = "Flowork workflow execution engine — pure Python, no web framework."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Flowork contributors" },
]
keywords = ["workflow", "dag", "agent", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.0",
    "json_repair>=0.60.1",
    "jinja2>=3.0",
    "requests>=2.25",
    "urllib3>=2,<3",
    "google-genai>=1.0,<3",
    "anthropic>=0.96,<1",
    "Pillow>=12.3.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
]

[project.urls]
Repository = "https://github.com/LYuhang/flowork"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecanvas_engine"]

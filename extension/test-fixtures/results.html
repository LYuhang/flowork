<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Results</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f7fb; color: #192033; }
      main { width: min(860px, calc(100% - 40px)); margin: 70px auto; }
      .query { color: #6757d9; font-weight: 700; }
      article { margin-top: 28px; padding: 28px; border: 1px solid #dfe4ef; border-radius: 18px; background: white; box-shadow: 0 12px 36px rgba(31, 42, 68, .08); }
      a { color: #4f43bd; font-size: 24px; font-weight: 750; text-decoration: none; }
      a:hover { text-decoration: underline; }
      p { color: #59627a; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main id="search-results">
      <h1>Search results</h1>
      <p>Showing the best match for <span class="query" id="search-term"></span></p>
      <article>
        <a id="primary-result" href="detail.html">Flowork browser automation guide</a>
        <p>Learn how an Agent connects, observes, acts, and verifies a real browser page.</p>
      </article>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const term = params.get("q") || sessionStorage.getItem("flowork.acceptance.search") || "";
      document.querySelector("#search-term").textContent = term;
      document.querySelector("#primary-result").href = `detail.html?from=${encodeURIComponent(term)}`;
      sessionStorage.setItem("flowork.acceptance.results", term);
      document.querySelector("#primary-result").addEventListener("click", () => {
        sessionStorage.setItem("flowork.acceptance.resultClicked", "true");
      });
    </script>
  </body>
</html>

# Flowork Web — nginx site config
#
# - SPA fallback: every unknown route serves /index.html so React Router
#   can pick it up.
# - /api/ is proxied to the FastAPI service. `proxy_buffering off` is
#   critical: agent_chat + execute_workflow stream SSE and any buffering
#   collapses the stream into "all at the end".
# - /healthz tunnels to the API liveness probe.
#
# Docker assigns a new address whenever the API container is recreated. Keep
# service discovery at the name level and let nginx refresh the embedded-DNS
# answer instead of pinning the address resolved at Web-container startup.
# 127.0.0.11 is Docker's embedded DNS listener on user-defined networks.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream flowork_api {
  zone flowork_api 64k;
  server api:8000 resolve;
  keepalive 32;
}

server {
  # Port 8080 is intentionally unprivileged; Compose publishes it as 9001 by
  # default while nginx itself runs as UID/GID 101.
  listen 8080;
  server_name _;

  # Bound unauthenticated request buffering and slow-body connections at the
  # first application-owned hop. The API independently counts actual ASGI
  # bytes; keeping both layers prevents a lying/missing Content-Length bypass.
  client_max_body_size 52m;
  client_header_timeout 10s;
  client_body_timeout 30s;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits the PDF.js module worker with an `.mjs` suffix. Alpine nginx's
  # bundled MIME table does not classify that suffix, and `nosniff` correctly
  # makes browsers reject the worker when it is served as octet-stream.
  # Match only an existing static module; never fall back to the SPA shell.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  # HSTS: the browser refuses to talk plaintext to this host
  # for a year after the first HTTPS response carrying this header, which
  # protects the session cookie / bearer token against SSL strip.
  # PRODUCTION REQUIREMENT: terminate TLS in front of this server (a
  # managed LB, an `nginx-proxy` sidecar, or a `listen 443 ssl` block
  # added here with a real certificate). Sending HSTS over plaintext is
  # harmless but only takes effect over HTTPS — without TLS termination
  # this header is a no-op.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_HASHES}; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' data: blob: http: https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'" always;

  # The extension side panel frames the web app at
  # `/embed/*` routes. Allow `chrome-extension://` as a `frame-ancestors`
  # source so the iframe is not blocked. Location-level add_header directives
  # intentionally replace the inherited DENY headers only for this route.
  #
  # The official nginx image expands only VIBECANVAS_BROWSER_EXTENSION_ID in this
  # template at startup. A pre-envsubst entrypoint rejects anything other than
  # a 32-character Chrome extension id, so production can never fall back to a
  # wildcard framing policy.
  location ^~ /embed/ {
    # NOTE: an `add_header` inside a `location` cancels the inherited
    # server-level `add_header`s, so re-state HSTS here to keep it on `/embed/*`.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_HASHES}; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' data: blob: http: https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'self' chrome-extension://${VIBECANVAS_BROWSER_EXTENSION_ID}" always;
    # Do not use `try_files ... /index.html` here. Its SPA fallback performs an
    # internal redirect that re-enters `location /`, replacing this location's
    # extension-specific framing policy with the server-wide DENY policy.
    # `break` keeps the rewritten index document in this location so the exact
    # extension origin remains the only non-self frame ancestor.
    rewrite ^ /index.html break;
  }

  # Agent-authored interactive HTML executes only inside this deliberately
  # isolated document boundary. The response-level CSP is independent from the
  # application shell, remains sandboxed even when opened directly, carries no
  # authentication, and permits network access only to same-origin capability
  # URLs. The iframe also omits `allow-same-origin`, so API cookies/storage are
  # unavailable to the generated page.
  location = /interactive-sandbox.html {
    try_files /interactive-sandbox.html =404;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-forms; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; form-action 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  }

  # SPA fallback — serve index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Browser-extension transport. Keep this exact route separate from the
  # generic API/SSE proxy below: that proxy deliberately clears Connection,
  # while an RFC 6455 handshake must preserve Upgrade at the first web hop.
  location = /api/v1/browser/ws {
    proxy_pass http://flowork_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Preserve the browser-facing port. `$host` normalizes
    # `127.0.0.1:9001` to `127.0.0.1`, which makes the API's exact Origin
    # validation reject otherwise same-origin unsafe requests in local and
    # non-default-port deployments.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
  }

  # API + SSE reverse proxy.
  location /api/ {
    proxy_pass http://flowork_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The API compares the browser Origin with the deployment-facing request
    # origin. Keep the original authority, including a non-default port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE-critical settings: never buffer, never close the long-lived
    # stream, never cache. We deliberately leave chunked transfer
    # encoding ON (nginx default) — SSE responses from
    # fastapi/uvicorn are chunked, and the convention across LangFlow /
    # Flowise / OpenAI's streaming cookbook is to let nginx pass them
    # through with chunked encoding intact. Disabling chunked encoding
    # would force nginx to fall back to indeterminate-length close-
    # delimited responses, which some intermediaries / older proxies
    # mis-handle on long-lived streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
  }

  # Liveness probe pass-through.
  location /healthz {
    proxy_pass http://flowork_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  # Never expose internal metrics via the public web origin.
  # Prometheus scrapes the api container directly at api:8000/metrics (and the
  # celery worker at :9100) over the private compose network. If metrics MUST
  # traverse nginx, replace this with a proxy_pass guarded by
  # `allow <prometheus_cidr>; deny all;` instead.
  location = /metrics {
    return 403;
  }
}
